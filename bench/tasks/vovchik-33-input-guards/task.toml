# Ticket 33 of vovchik-furniture-kit: a hotfix that makes the workshop, orders and cutting refuse
# bad input (ranges in the models, strict YAML, fractional kerf, the version hash). Two returns,
# 313 min from first commit to last fix. The first review found 4 blocking and 9 minor findings:
# two regressions of the new YAML loader, an unbounded fastening step, a CLI contract test
# narrower than the acceptance checks; then negative norms, a file in place of the output
# folder, a kerf warning that lost digits. The spec already lists the acceptance checks, so the
# prompt appends none. The base already carries harness v1.2.
repo = "git@github.com:AndreiSerov/vovchik-furniture-kit.git"
base = "633283a"           # the spec of tickets 33 and 34, before the build
first_handback = "8b3af28" # 0/12 hidden tests
final = "ea8c5cb"          # 12/12
prefix = "33"

[variants.v1_2]
ref = ""
paths = []
fresh_from_return = 2

# v1.3: the template's implementer, claim and session-stats, and parallel tests.
[variants.v1_3]
ref = ""
paths = []
template = "eecd335"
template_paths = [
  ".claude/agents/implementer.md",
  "scripts/claim",
  "scripts/session-stats",
]
setup = [
  "uv add -q --dev pytest-xdist",
  "python3 -c \"import pathlib; p = pathlib.Path('scripts/check'); s = p.read_text(); assert 'uv run pytest -q -x\\n' in s; p.write_text(s.replace('uv run pytest -q -x\\n', 'uv run pytest -q -x -n auto\\n'))\"",
]
fresh_from_return = 2
